<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Garasi Sutera Royale</title>
    <meta name="description" content="Showroom kendaraan Sutera Royale: putar, ganti warna, nyalakan lampu.">
    <link rel="icon" href="data:,">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --ink: #f5f3ff; --dim: rgba(245, 243, 255, .62); --line: rgba(255, 255, 255, .13); --glass: rgba(16, 14, 36, .62);
            --gold: #D29F52; --gold2: #f2cf8d; --violet: #503EBA;
            --display: "Optima Nova LT Pro", Optima, Candara, "Segoe UI", sans-serif;
            --body: "Semplicita Pro", "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0c18; color: var(--ink); font-family: var(--body); }
        #scene { position: fixed; inset: 0; }
        #scene canvas { display: block; cursor: grab; }
        #scene canvas:active { cursor: grabbing; }
        .panel { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: min(400px, 100vw); padding: 34px 30px 24px; display: flex; flex-direction: column; gap: 16px;
            background: linear-gradient(100deg, rgba(18, 15, 44, .92) 0%, rgba(24, 20, 60, .78) 72%, rgba(24, 20, 60, 0) 100%); overflow: auto; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(210, 159, 82, .25); }
        h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 600; font-size: clamp(34px, 5vw, 46px); line-height: .98; letter-spacing: .07em;
            background: linear-gradient(180deg, #fff 30%, #DCB677); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .lead { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.5; }
        .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .tabs button { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.04); color: var(--dim); cursor: pointer;
            font: 600 14px/1.2 var(--body); transition: border-color .15s, background .15s, color .15s; }
        .tabs button small { display: block; margin-top: 3px; font-size: 11px; font-weight: 500; letter-spacing: .04em; color: rgba(245,243,255,.45); }
        .tabs button:hover { color: var(--ink); border-color: rgba(255,255,255,.28); }
        .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); background: rgba(210, 159, 82, .12); box-shadow: inset 0 0 0 1px rgba(210,159,82,.35); }
        .card { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--glass); backdrop-filter: blur(8px); display: grid; gap: 12px; }
        .card h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: .03em; }
        .tag { margin: -6px 0 0; color: var(--gold2); font-size: 14px; }
        .stat { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
        .stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 14px; }
        .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
        .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
        .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 10px; }
        .meta b { color: var(--ink); font-weight: 600; }
        .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); width: 100%; }
        .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; padding: 0; transition: transform .12s, border-color .12s; }
        .sw:hover { transform: scale(1.08); }
        .sw[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 3px rgba(210, 159, 82, .55); }
        .tog { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.05); color: var(--dim); cursor: pointer; font: 600 13px/1 var(--body); }
        .tog[aria-pressed="true"] { color: #1d1a3c; background: linear-gradient(180deg, var(--gold2), var(--gold)); border-color: transparent; }
        .play { display: inline-block; text-decoration: none; border-radius: 12px; padding: 14px 26px; font: 800 15px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: #1d1a3c;
            background: linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow: 0 14px 30px -12px rgba(210, 159, 82, .8), inset 0 1px 0 rgba(255,255,255,.6); align-self: flex-start; }
        .back { color: var(--dim); font-size: 13px; text-decoration: none; margin-top: auto; } .back:hover { color: var(--ink); }
        .hint { position: fixed; z-index: 4; right: 18px; bottom: 16px; font-size: 12px; color: var(--dim); background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); }
        .hint kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid rgba(255,255,255,.35); border-bottom-width: 2px; font: 700 11px/1 var(--body); color: var(--ink); }
        .loading { position: fixed; z-index: 6; inset: 0; display: grid; place-items: center; background: #0d0c18; color: var(--dim); font-size: 14px; letter-spacing: .2em; text-transform: uppercase; transition: opacity .5s; }
        .loading.done { opacity: 0; pointer-events: none; }
        .loading.err { color: #ff8f80; letter-spacing: .02em; text-transform: none; }
        @media (max-width: 720px) {
            .panel { top: auto; width: 100vw; max-height: 52vh; padding: 16px 16px 18px; gap: 12px; background: linear-gradient(0deg, rgba(18, 15, 44, .96) 75%, rgba(18, 15, 44, 0)); }
            h1, .lead, .brand { display: none; }
            .tabs { grid-template-columns: repeat(4, 1fr); }
            .tabs button small { display: none; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="scene" aria-label="Kendaraan 3D, seret untuk memutar"></div>
    <div class="loading" id="loading" role="status" aria-live="polite">Memuat garasi…</div>

    <aside class="panel" aria-labelledby="ttl">
        <div class="brand"><span class="dot"></span>Alam Sutera · garasi</div>
        <h1 id="ttl">GARASI<br>SUTERA ROYALE</h1>
        <p class="lead">Kendaraan yang bisa kamu kendarai di arena. Seret untuk memutar, scroll untuk zoom.</p>
        <div class="tabs" id="tabs" role="group" aria-label="Pilih kendaraan"></div>
        <section class="card" aria-live="polite">
            <h2 id="vName">–</h2>
            <p class="tag" id="vTag"></p>
            <div class="stat"><span>Kecepatan</span><div class="bar"><i id="bSpeed"></i></div><b id="tSpeed">–</b></div>
            <div class="stat"><span>Ketahanan</span><div class="bar"><i id="bHp"></i></div><b id="tHp">–</b></div>
            <div class="stat"><span>Kursi</span><div class="bar"><i id="bSeat"></i></div><b id="tSeat">–</b></div>
            <div class="meta" id="vMeta"></div>
        </section>
        <div class="row" id="swatches" role="group" aria-label="Warna cat"><span class="lbl">Warna cat</span></div>
        <div class="row">
            <button class="tog" id="lights" type="button" aria-pressed="false">Lampu</button>
            <button class="tog" id="spin" type="button" aria-pressed="true">Putar otomatis</button>
            <button class="tog" id="horn" type="button">Klakson</button>
        </div>
        <a class="play" href="royale.html">Main Sutera Royale</a>
        <a class="back" href="index.html">← Kembali ke peta digital twin</a>
    </aside>
    <div class="hint"><kbd>1</kbd>–<kbd>6</kbd> ganti kendaraan · <kbd>H</kbd> klakson · <kbd>L</kbd> lampu · <kbd>Spasi</kbd> putar</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        // model & material yang sama persis dengan game (cat clearcoat, AO per verteks, celah panel, kaca, ban bertapak)
        import { createVehicleLook, loadVehicleTemplates, instantiateVehicle } from './game/vehicles.js';

        const $ = (id) => document.getElementById(id);
        // angka yang dipakai game (web/game/vehicles.js)
        const SPEC = {
            lintas: { speed: 125, hp: 1000, tag: 'Gesit di jalan raya', key: 'Hatchback 5 pintu' },
            banteng: { speed: 110, hp: 1500, tag: 'Tangguh di rumput & tabrakan', key: '4x4 terbuka' },
            walet: { speed: 115, hp: 450, tag: 'Akselerasi paling cepat, pengendara terbuka', key: 'Skuter matic' },
            loop: { speed: 80, hp: 2600, tag: 'Trem kawasan: lambat tapi paling tahan tembakan · 12 kursi', key: 'Trem Sutera Loop' },
            halilintar: { speed: 240, hp: 650, tag: 'Tercepat di kawasan tapi rapuh · 2 kursi', key: 'Supercar 2 pintu' },
            jawara: { speed: 165, hp: 600, tag: 'Cruiser V-twin, berat & stabil · 2 kursi', key: 'Motor cruiser' },
        };
        const BASE = 'game/assets/vehicles/';
        const state = { id: null, color: {}, lights: false, ready: false };

        // ---------- renderer & scene ----------
        const host = $('scene');
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        host.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#100f1f');
        scene.fog = new THREE.Fog('#100f1f', 30, 90);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
        const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(7, 3, 8);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.7;
        controls.maxPolarAngle = Math.PI * 0.49;
        controls.enablePan = false;

        const sun = new THREE.DirectionalLight('#fff4e6', 2.2);
        sun.position.set(6, 10, 7);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.bias = -0.0004;
        sun.shadow.normalBias = 0.02;
        scene.add(sun, sun.target);
        scene.add(new THREE.HemisphereLight('#c9c3ff', '#1a1530', 0.35));

        // lantai: piringan putar + cincin emas + bayangan lembut
        function radialTex(inner, outer) {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const g = c.getContext('2d');
            const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
            gr.addColorStop(0, inner);
            gr.addColorStop(1, outer);
            g.fillStyle = gr;
            g.fillRect(0, 0, 256, 256);
            const t = new THREE.CanvasTexture(c);
            t.colorSpace = THREE.SRGBColorSpace;
            return t;
        }
        const floor = new THREE.Mesh(new THREE.CircleGeometry(140, 64), new THREE.MeshStandardMaterial({ map: radialTex('#2f2a52', '#100f1f'), roughness: 0.92, metalness: 0, envMapIntensity: 0.25 }));
        floor.receiveShadow = true;
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.002;
        scene.add(floor);
        const disc = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.06, 96), new THREE.MeshStandardMaterial({ color: '#2a2644', roughness: 0.5, metalness: 0.25 }));
        disc.position.y = -0.03;
        disc.receiveShadow = true;
        scene.add(disc);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 8, 160), new THREE.MeshStandardMaterial({ color: '#D29F52', emissive: '#6b4a1a', roughness: 0.3, metalness: 0.8 }));
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.001;
        scene.add(ring);
        const shadowCatch = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.45 }));
        shadowCatch.rotation.x = -Math.PI / 2;
        shadowCatch.position.y = 0.002;
        shadowCatch.receiveShadow = true;
        scene.add(shadowCatch);

        // ---------- kendaraan ----------
        const look = createVehicleLook(scene.environment);
        const cache = {};
        let manifest = [];
        let current = null;
        const beams = [new THREE.SpotLight('#fff2d6', 0, 22, 0.42, 0.55, 1.4), new THREE.SpotLight('#fff2d6', 0, 22, 0.42, 0.55, 1.4)];
        for (const b of beams) scene.add(b, b.target);

        // satu kendaraan = templat game (web/game/vehicles.js) → salinan dengan cat sendiri, dibungkus grup supaya bisa diskala
        async function load(id) {
            if (cache[id]) return cache[id];
            const m = manifest.find((x) => x.id === id);
            const tpl = (await loadVehicleTemplates(renderer, look, [id]))[id];
            if (!tpl) throw new Error('model ' + id + ' tidak ada');
            const inst = instantiateVehicle(tpl, state.color[id] || m.colors[0]);
            for (const o of inst.cast) o.castShadow = true;
            const root = new THREE.Group();
            root.add(inst.obj);
            root.userData.manifest = m;
            root.userData.inst = inst;
            cache[id] = root;
            return root;
        }
        function setLights(on) {
            state.lights = on;
            $('lights').setAttribute('aria-pressed', String(on));
            if (!current) return;
            current.userData.inst.setLights(on ? 9 : 0.9, on ? 2.6 : 0.3); // lampu rem & lampu utama (pijar per verteks × pengali)
            const m = current.userData.manifest;
            const L = [m.nodes.light_fl || m.nodes.light_f, m.nodes.light_fr].filter(Boolean);
            beams.forEach((b, i) => {
                const p = L[i];
                b.intensity = on && p ? 1400 : 0;
                if (!p) return;
                b.position.set(p[0], p[1], p[2]);
                b.target.position.set(p[0] * 1.3, 0, p[2] + 4.5);
            });
        }
        function setColor(hex) {
            if (!current) return;
            state.color[state.id] = hex;
            current.userData.inst.setColor(hex);
            for (const b of document.querySelectorAll('.sw')) b.setAttribute('aria-pressed', String(b.dataset.hex === hex));
        }
        const tween = { t: 1, from: new THREE.Vector3(), to: new THREE.Vector3(), tf: new THREE.Vector3(), tt: new THREE.Vector3() };
        async function select(id) {
            if (state.id === id && current) return;
            state.id = id;
            for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', String(b.dataset.id === id));
            const root = await load(id);
            if (state.id !== id) return;
            if (current) scene.remove(current);
            current = root;
            scene.add(root);
            root.scale.setScalar(0.92);
            root.userData.pop = 0;
            const m = root.userData.manifest, s = SPEC[id] || {};
            // kartu
            $('vName').textContent = m.name;
            $('vTag').textContent = s.tag || '';
            $('tSpeed').textContent = (s.speed || '–') + ' km/j';
            $('tHp').textContent = s.hp || '–';
            $('tSeat').textContent = m.seats;
            $('bSpeed').style.width = Math.round((s.speed || 0) / 130 * 100) + '%';
            $('bHp').style.width = Math.round((s.hp || 0) / 2600 * 100) + '%';
            $('bSeat').style.width = Math.round(m.seats / 12 * 100) + '%';
            $('vMeta').innerHTML = '<span>' + (s.key || '') + '</span><span>P×L×T <b>' + m.length.toFixed(2) + ' × ' + m.width.toFixed(2) + ' × ' + m.height.toFixed(2) + ' m</b></span><span><b>' + m.tris.toLocaleString('id-ID') + '</b> segitiga</span>';
            // warna
            const sw = $('swatches');
            for (const b of sw.querySelectorAll('.sw')) b.remove();
            for (const hex of m.colors) {
                const b = document.createElement('button');
                b.className = 'sw';
                b.type = 'button';
                b.dataset.hex = hex;
                b.style.background = hex;
                b.setAttribute('aria-label', 'Warna ' + hex);
                b.addEventListener('click', () => setColor(hex));
                sw.appendChild(b);
            }
            setColor(state.color[id] || m.colors[0]);
            setLights(state.lights);
            // panggung & kamera
            const r = Math.max(m.length, m.width) * 0.62 + 0.4;
            disc.scale.set(r, 1, r);
            ring.scale.set(r, r, 1);
            sun.shadow.camera.left = sun.shadow.camera.bottom = -r * 1.4;
            sun.shadow.camera.right = sun.shadow.camera.top = r * 1.4;
            sun.shadow.camera.updateProjectionMatrix();
            const d = fit(m);
            controls.minDistance = d * 0.45;
            controls.maxDistance = d * 2.0;
            tween.from.copy(camera.position);
            tween.tf.copy(controls.target);
            const dir = camera.position.clone().sub(controls.target).setY(0).normalize();
            if (!isFinite(dir.x) || dir.lengthSq() < 0.5) dir.set(0.6, 0, 0.8);
            tween.to.copy(dir.multiplyScalar(d * 0.96)).setY(m.height * 0.42 + d * 0.27);
            tween.tt.set(0, m.height * 0.42, 0);
            tween.t = 0;
        }

        // klakson: klip audio per kendaraan dari manifest (field horn), lampu ikut berkedip
        const horns = {};
        let flashT = 0;
        function honk() {
            if (!current) return;
            const m = current.userData.manifest;
            if (!m.horn) return;
            let a = horns[m.horn];
            if (!a) { a = horns[m.horn] = new Audio(BASE + m.horn); a.preload = 'auto'; }
            a.currentTime = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
            if (!state.lights) {
                setLights(true);
                state.lights = false;
                clearTimeout(flashT);
                flashT = setTimeout(() => setLights(state.lights), 420);
            }
        }

        // ---------- UI ----------
        $('horn').addEventListener('click', honk);
        $('lights').addEventListener('click', () => setLights(!state.lights));
        $('spin').addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; $('spin').setAttribute('aria-pressed', String(controls.autoRotate)); });
        addEventListener('keydown', (e) => {
            if (e.target.closest && e.target.closest('input, textarea')) return;
            const i = /^Digit[1-9]$/.test(e.code) ? +e.code.slice(5) - 1 : -1;
            if (i >= 0 && manifest[i]) select(manifest[i].id);
            if (e.code === 'KeyL') setLights(!state.lights);
            if (e.code === 'KeyH' && !e.repeat) honk();
            if (e.code === 'Space') { e.preventDefault(); $('spin').click(); }
        });
        // jarak kamera supaya kendaraan muat di area yang tidak tertutup panel, + geser pusat pandang ke area itu
        function fit(m) {
            const W = innerWidth, H = innerHeight, mobile = W <= 720;
            const visW = mobile ? W : Math.max(320, W - 400), visH = mobile ? H * 0.46 : H;
            camera.aspect = W / H;
            if (mobile) camera.setViewOffset(W, H, 0, H * 0.25, W, H);
            else camera.setViewOffset(W, H, -Math.min(200, (W - visW) / 2), 0, W, H);
            camera.updateProjectionMatrix();
            if (!m) return 0;
            const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            const half = Math.min(Math.atan(t * visH / H), Math.atan(t * visW / H));
            const R = 0.5 * Math.hypot(m.length, m.width, m.height);
            return R / Math.sin(half) * 1.04;
        }
        addEventListener('resize', () => {
            renderer.setSize(innerWidth, innerHeight);
            const m = current && current.userData.manifest;
            const d = fit(m);
            if (!d) return;
            const off = camera.position.clone().sub(controls.target);
            camera.position.copy(controls.target).add(off.multiplyScalar(d / off.length()));
            controls.minDistance = d * 0.45;
            controls.maxDistance = d * 2.0;
        });

        // ---------- loop ----------
        const clock = new THREE.Clock();
        function frame() {
            requestAnimationFrame(frame);
            const dt = Math.min(0.05, clock.getDelta());
            if (tween.t < 1) {
                tween.t = Math.min(1, tween.t + dt / 0.9);
                const k = 1 - Math.pow(1 - tween.t, 3);
                camera.position.lerpVectors(tween.from, tween.to, k);
                controls.target.lerpVectors(tween.tf, tween.tt, k);
            }
            if (current && current.userData.pop < 1) {
                current.userData.pop = Math.min(1, current.userData.pop + dt / 0.5);
                current.scale.setScalar(0.92 + 0.08 * (1 - Math.pow(1 - current.userData.pop, 3)));
            }
            // panggung dan bayangan ikut menghadap kamera supaya kontrol orbit terasa seperti meja putar
            controls.update();
            renderer.render(scene, camera);
        }

        // ---------- mulai ----------
        (async () => {
            try {
                const res = await fetch(BASE + 'manifest.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                manifest = await res.json();
                const tabs = $('tabs');
                manifest.forEach((m, i) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.dataset.id = m.id;
                    b.setAttribute('aria-pressed', 'false');
                    b.innerHTML = m.name + '<small>' + ((SPEC[m.id] && SPEC[m.id].key) || '') + ' · ' + (i + 1) + '</small>';
                    b.addEventListener('click', () => select(m.id));
                    tabs.appendChild(b);
                });
                const first = new URLSearchParams(location.search).get('v') || (manifest.some((m) => m.id === 'halilintar') ? 'halilintar' : manifest[0].id); // supercar tampil pertama
                await select(manifest.some((m) => m.id === first) ? first : manifest[0].id);
                frame();
                $('loading').classList.add('done');
                manifest.forEach((m) => load(m.id).catch(() => {}));
            } catch (e) {
                console.error(e);
                $('loading').textContent = 'Garasi gagal dimuat: ' + e.message;
                $('loading').classList.add('err');
            }
        })();
    </script>
</body>
</html>
